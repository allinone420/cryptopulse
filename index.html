    <script>
      // Seamless Telegram WebApp environment setup for AI Studio preview & standard browsers
      (function() {
        try {
          // Provide default Telegram init params so @twa-dev/sdk initializes smoothly in web/preview
          var stored = sessionStorage.getItem('__telegram__initParams');
          if (!stored) {
            sessionStorage.setItem('__telegram__initParams', JSON.stringify({
              tgWebAppVersion: "7.10",
              tgWebAppPlatform: "weba",
              tgWebAppThemeParams: JSON.stringify({
                bg_color: "#0f1218",
                text_color: "#ffffff",
                secondary_bg_color: "#1c212b",
                button_color: "#f3ba2f",
                button_text_color: "#000000"
              })
            }));
          }
        } catch (e) {}

        // Harmless fallback for window.Telegram in non-telegram web contexts
        try {
          if (!window.Telegram) window.Telegram = {};
          if (!window.Telegram.WebApp) {
            window.Telegram.WebApp = {
              version: "7.10",
              platform: "weba",
              colorScheme: "dark",
              themeParams: { bg_color: "#0f1218", text_color: "#ffffff" },
              isExpanded: true,
              viewportHeight: window.innerHeight || 800,
              viewportStableHeight: window.innerHeight || 800,
              initData: "",
              initDataUnsafe: {},
              ready: function(){},
              expand: function(){},
              close: function(){},
              setHeaderColor: function(){},
              setBackgroundColor: function(){},
              enableClosingConfirmation: function(){},
              HapticFeedback: {
                impactOccurred: function(){},
                notificationOccurred: function(){},
                selectionChanged: function(){}
              },
              MainButton: {
                show: function(){}, hide: function(){}, setText: function(){},
                onClick: function(){}, offClick: function(){},
                showProgress: function(){}, hideProgress: function(){}
              },
              BackButton: {
                show: function(){}, hide: function(){},
                onClick: function(){}, offClick: function(){}
              },
              CloudStorage: {
                setItem: function(k, v, cb) {
                  try { localStorage.setItem('_tg_'+k, v); } catch(e){}
                  if(cb) cb(null, true);
                  return Promise.resolve(true);
                },
                getItem: function(k, cb) {
                  var v = null;
                  try { v = localStorage.getItem('_tg_'+k); } catch(e){}
                  if(cb) cb(null, v);
                  return Promise.resolve(v);
                },
                getItems: function(ks, cb) {
                  var r = {};
                  try { ks.forEach(function(k){ r[k] = localStorage.getItem('_tg_'+k); }); } catch(e){}
                  if(cb) cb(null, r);
                  return Promise.resolve(r);
                },
                removeItem: function(k, cb) {
                  try { localStorage.removeItem('_tg_'+k); } catch(e){}
                  if(cb) cb(null, true);
                  return Promise.resolve(true);
                },
                removeItems: function(ks, cb) {
                  try { ks.forEach(function(k){ localStorage.removeItem('_tg_'+k); }); } catch(e){}
                  if(cb) cb(null, true);
                  return Promise.resolve(true);
                },
                getKeys: function(cb) {
                  var ks = [];
                  try {
                    ks = Object.keys(localStorage).filter(function(k){ return k.indexOf('_tg_') === 0; }).map(function(k){ return k.replace('_tg_', ''); });
                  } catch(e){}
                  if(cb) cb(null, ks);
                  return Promise.resolve(ks);
                }
              }
            };
          }
        } catch(e) {}
      })();
    </script>
