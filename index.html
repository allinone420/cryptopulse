<!doctype html>
<html lang="en" style="background-color: #0f1218; color: #ffffff; min-height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1218" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SatoCryp</title>
    <meta name="description" content="SatoCryp is a premier Telegram Mini App tap-to-earn game with a robust token launch hub, staking vaults, and airdrop distribution." />
    <meta property="og:title" content="SatoCryp" />
    <meta property="og:description" content="SatoCryp Telegram Mini App Tap-to-Earn & Token Launch Hub" />

    <!-- Telegram Official WebApp SDK (Required for Telegram Mini App) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (typeof window.Telegram.WebApp.setHeaderColor === 'function') {
              window.Telegram.WebApp.setHeaderColor('#0f1218');
            }
            if (typeof window.Telegram.WebApp.setBackgroundColor === 'function') {
              window.Telegram.WebApp.setBackgroundColor('#0f1218');
            }
          }
        } catch (e) {
          console.warn('Initial Telegram initialization notice:', e);
        }
      })();
    </script>

    <!-- In-Memory Storage Polyfill (Guarantees tonconnect and firebase never crash on restricted webview storage) -->
    <script>
      (function() {
        var isStorageSafe = false;
        try {
          var testKey = '__satocryp_storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
          isStorageSafe = true;
        } catch (e) {
          isStorageSafe = false;
        }

        if (!isStorageSafe) {
          var memoryStorage = {};
          var fakeStorage = {
            getItem: function(key) { return memoryStorage.hasOwnProperty(key) ? memoryStorage[key] : null; },
            setItem: function(key, val) { memoryStorage[key] = String(val); },
            removeItem: function(key) { delete memoryStorage[key]; },
            clear: function() { memoryStorage = {}; },
            key: function(i) { return Object.keys(memoryStorage)[i] || null; },
            get length() { return Object.keys(memoryStorage).length; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: fakeStorage, configurable: true, enumerable: true, writable: true });
          } catch(e) {}
          try {
            Object.defineProperty(window, 'sessionStorage', { value: fakeStorage, configurable: true, enumerable: true, writable: true });
          } catch(e) {}
        }
      })();
    </script>

    <style>
      :root, html, body {
        background-color: #0f1218 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        -webkit-font-smoothing: antialiased;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      @keyframes satocryp-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes satocryp-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <!-- Global diagnostic script error logger with capture phase and aggressive cache bust -->
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a || ''); }).join(' ');
          if (str.indexOf('TON_CONNECT_SDK') !== -1 || str.indexOf('analytics') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();

      window.__SATOCRYP_MOUNTED = false;
      function hardReload() {
        try {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for(var j = 0; j < registrations.length; j++) {
                registrations[j].unregister();
              }
            });
          }
          localStorage.clear();
          sessionStorage.clear();
        } catch(e) {}
        var cleanUrl = window.location.href.split('?')[0].split('#')[0];
        window.location.replace(cleanUrl + '?v=' + Date.now());
      }

      function showDiagError(msg) {
        var errBox = document.getElementById('satocryp-diag-box');
        if (errBox) {
          errBox.style.display = 'block';
          var errMsg = document.getElementById('satocryp-diag-msg');
          if (errMsg && msg) errMsg.textContent = msg;
        }
      }
      window.addEventListener('error', function(e) {
        console.warn('Script error caught:', e);
        var isScriptLoadError = e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK');
        var message = e.message || (e.target && e.target.src ? 'Failed to load script: ' + e.target.src : 'Initialization error');
        showDiagError(message);
        if (isScriptLoadError) {
          // Automatically attempt hard reload once if script failed to load due to stale cache
          var reloadKey = '_satocryp_auto_reloaded';
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            setTimeout(hardReload, 1200);
          }
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = '';
        try {
          reasonStr = JSON.stringify(e.reason || '');
        } catch (err) {
          reasonStr = String(e.reason || '');
        }
        var message = (e.reason && e.reason.message) ? e.reason.message : String(e.reason || 'Network error');
        if (message.indexOf('analytics') !== -1 || message.indexOf('TON_CONNECT_SDK') !== -1 || reasonStr.indexOf('analytics') !== -1) {
          // Suppress harmless TonConnect SDK analytics telemetry fetch errors
          e.preventDefault();
          return;
        }
        console.warn('Promise rejection caught:', e.reason);
        showDiagError(message);
      });
      // Safety timeout: If React takes more than 4s to mount, show recovery controls
      setTimeout(function() {
        if (!window.__SATOCRYP_MOUNTED) {
          showDiagError('Taking longer than expected. Tap reload below to refresh the connection.');
        }
      }, 4000);
    </script>

    <!-- Monetag Ads Integration (async with error tolerance) -->
    <script async src='https://libtl.com/sdk.js' data-zone='10932949' data-sdk='show_10932949' onerror="console.warn('Ads SDK notice: script unavailable')"></script>
  </head>
  <body style="background-color: #0f1218; color: #ffffff; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="satocryp-preloader" style="min-height: 100vh; background-color: #0f1218; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; padding: 24px; text-align: center; box-sizing: border-box;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #f3ba2f, #d97706); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #000; box-shadow: 0 0 35px rgba(243, 186, 47, 0.45); animation: satocryp-pulse 2s infinite ease-in-out; margin-bottom: 20px;">
          S
        </div>
        <div style="font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #f3ba2f; margin-bottom: 8px;">
          SatoCryp
        </div>
        <div style="font-size: 13px; color: #9ca3af; margin-bottom: 28px; max-width: 260px;">
          Next-Gen Tap-to-Earn & Token Launch Hub
        </div>
        <div style="width: 38px; height: 38px; border: 3px solid rgba(243, 186, 47, 0.2); border-top: 3px solid #f3ba2f; border-radius: 50%; animation: satocryp-spin 0.8s linear infinite; margin-bottom: 24px;"></div>
        
        <div id="satocryp-diag-box" style="display: none; margin-top: 16px; padding: 14px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 14px; max-width: 290px;">
          <p id="satocryp-diag-msg" style="color: #fca5a5; font-size: 12px; margin: 0 0 12px 0; word-break: break-word; line-height: 1.4;"></p>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button onclick="hardReload()" style="background-color: #f3ba2f; color: #000; font-weight: bold; border: none; padding: 9px 18px; border-radius: 9px; font-size: 12px; cursor: pointer;">Reload</button>
            <button onclick="hardReload()" style="background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; border: none; padding: 9px 14px; border-radius: 9px; font-size: 12px; cursor: pointer;">Reset Cache</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
